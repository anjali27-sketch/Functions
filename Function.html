<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="printNum()">Onclick</button>
    <button onmouseover="num()">Onmouseover</button>
    <button onmouseout="obj()">Onmouseout</button>
    <button onmouseup="check()">Onmouseup</button>
    <button onmousedown="show()">Onmousedown</button>
    <script>
        function printNum() {
            alert("This is onclick event");
            for (let i=1; i<=10; i++) {
                console.log(i);
            }
        }
        

        function num() {
            alert("This is onmouseover event");
            let j=11;
            while(j<=20)  {
               console.log(j);
               j++
            }
        }
        

        function obj() {
            alert("This is onmouseout event");
            let k=21;
            do {
                console.log(k);
                k++;
            }while(k<=30);
        }
        


        function check() {
            alert("This is onmouseup event");
            let age =10;
            if (age >=18) {
            console.log("Eligible for voting")
            }
            else {
            console.log("Not Eligible for voting")
            }
        }
        

        function show() {
            alert("This is onmousedown event");
            let marks = 75;
          if (marks >= 90) {
             console.log("Grade A");
        } else if (marks >= 75) {
            console.log("Grade B");
        } else if (marks >= 50) {
            console.log("Grade C");
        } else {
            console.log("Fail");
        }
        }
        

        function msg() {
            
            let day = 3;
            switch(day) {
            case 1:
            console.log("Monday");
            break;
             case 2:
            console.log("Tuesday");
             break;
             case 3:
            console.log("Wednesday");
            break;
            default:
             console.log("Invalid day");
            }
         }
         msg();
    </script>
</body>
</html>
