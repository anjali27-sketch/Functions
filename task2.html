<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>Mobile Number Validation and OTP</title>
</head>
<body>
    <h2>Mobile Number Validation:</h2>
    <label>Enter Mobile Number</label>
    <input type="text" id="mobile" maxlength="10">
    <button onclick="generateOTP()">Generate OTP</button>
    <p id="message"></p>
    <p id="otp"></p>
    <script>
        function generateOTP()
        {
            let mobile=document.getElementById("mobile").value;
            let pattern=/^[6-9][0-9]{9}$/;
            if (!pattern.test(mobile)) {
                document.getElementById("message").innerHTML="Invalid mobile number";
                document.getElementById("otp").innerHTML="";
                return;
            }
            let otp1 = mobile.slice(-4);
            let digit = otp1.split('');
            digit.sort(() => Math.random() - 0.5);
            let otp =digit.join('');
        
            document.getElementById("message").innerHTML=" Mobile number is valid";
            document.getElementById("otp").innerHTML="OTP:"+otp;

        }
    </script>
</body>
</html>
